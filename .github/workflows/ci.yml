name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt
          pip install -e ".[dev]"
      - name: Format and imports
        run: |
          black --check .
          isort --check-only .
      - name: Flake8
        run: flake8 .
      - name: Mypy
        run: mypy src/shared
      - name: Tests with coverage floor
        run: pytest --cov --cov-report=term-missing
